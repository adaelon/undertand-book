[package]
name = "understand-book-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
server = { path = "../../../crates/server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[[bin]]
name = "UnderstandBook"
path = "src/main.rs"
