[package]
name = "artifact-tools"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
unicode-casefold = "0.2.0"
unicode-normalization = "0.1.25"
